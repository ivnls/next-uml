<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextUML</title>
<meta name="description" content="Editor de diagramas de classes UML no navegador, com modelo compartilhado, geração de código e exportação XMI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,600&display=swap">
<style>
/* Layout: aplicação de tela cheia. Barra superior e faixa de ferramentas; navegador do modelo à esquerda, folha de desenho ao centro, propriedades à direita. */
:root {
  --paper: #F2F6F5; --panel: #FFFFFF; --panel-2: #EEF3F2; --ink: #17232C; --muted: #5B6C73; --line: #D2DCDA;
  --grid: rgba(14, 124, 107, .11); --accent: #0E7C6B; --accent-ink: #FFFFFF; --accent-soft: rgba(14, 124, 107, .12);
  --shape-fill: #FFFFFF; --shape-head: #E2F0ED; --pkg-fill: rgba(14, 124, 107, .035); --note-fill: #FFF5CC; --note-stroke: #B39D4E;
  --danger: #B3372E; --warn: #A86A00; --info: #2F6690; --scrim: rgba(10, 20, 25, .35); --shadow: 0 14px 40px rgba(16, 32, 40, .18);
  --c-teal: #DDF1EC; --h-teal: #C3E5DC; --c-blue: #DFEAF7; --h-blue: #C7DAF0; --c-amber: #FBF0D6; --h-amber: #F4DFAE;
  --c-rose: #F9E3E5; --h-rose: #F0C9CE; --c-violet: #ECE6F7; --h-violet: #D9CDF0; --c-slate: #E9ECEE; --h-slate: #D5DBDF;
  --ui: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F161B; --panel: #162027; --panel-2: #1B262E; --ink: #DAE5E3; --muted: #8EA19F; --line: #2B3940;
    --grid: rgba(90, 210, 186, .07); --accent: #3EC0A7; --accent-ink: #06201B; --accent-soft: rgba(62, 192, 167, .16);
    --shape-fill: #17222A; --shape-head: #1E3332; --pkg-fill: rgba(62, 192, 167, .04); --note-fill: #383321; --note-stroke: #8E7C3F;
    --danger: #F0776B; --warn: #E4B55A; --info: #7FB4DE; --scrim: rgba(0, 0, 0, .5); --shadow: 0 14px 40px rgba(0, 0, 0, .45);
    --c-teal: #173430; --h-teal: #1E4640; --c-blue: #182B3D; --h-blue: #203A52; --c-amber: #352D18; --h-amber: #4A3E1F;
    --c-rose: #37222A; --h-rose: #4A2C36; --c-violet: #29233D; --h-violet: #372F52; --c-slate: #222B31; --h-slate: #2E3940;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F161B; --panel: #162027; --panel-2: #1B262E; --ink: #DAE5E3; --muted: #8EA19F; --line: #2B3940;
  --grid: rgba(90, 210, 186, .07); --accent: #3EC0A7; --accent-ink: #06201B; --accent-soft: rgba(62, 192, 167, .16);
  --shape-fill: #17222A; --shape-head: #1E3332; --pkg-fill: rgba(62, 192, 167, .04); --note-fill: #383321; --note-stroke: #8E7C3F;
  --danger: #F0776B; --warn: #E4B55A; --info: #7FB4DE; --scrim: rgba(0, 0, 0, .5); --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --c-teal: #173430; --h-teal: #1E4640; --c-blue: #182B3D; --h-blue: #203A52; --c-amber: #352D18; --h-amber: #4A3E1F;
  --c-rose: #37222A; --h-rose: #4A2C36; --c-violet: #29233D; --h-violet: #372F52; --c-slate: #222B31; --h-slate: #2E3940;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--panel); color: var(--ink); font: 13px/1.45 var(--ui); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-columns: 252px minmax(0, 1fr) 312px;
  grid-template-areas: "top top top" "tools tools tools" "left canvas right";
}

/* ---------- barra superior ---------- */
.top {
  grid-area: top; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); min-width: 0;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.crumb { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 320px; }
.actions { display: flex; align-items: center; gap: 2px; margin-left: auto; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.actions::-webkit-scrollbar { display: none; }
::placeholder { color: var(--muted); opacity: .65; }
.sep { width: 1px; height: 20px; background: var(--line); margin-inline: 6px; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid transparent;
  border-radius: 6px; background: none; cursor: pointer; white-space: nowrap; flex: none; position: relative;
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .4; cursor: default; background: none; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.outline { border-color: var(--line); }
.btn.danger { color: var(--danger); }
.btn.sm { height: 26px; font-size: 12px; padding: 0 8px; }
.btn .caret { width: 10px; height: 10px; opacity: .7; }
.zoom { font-variant-numeric: tabular-nums; min-width: 56px; justify-content: center; font-family: var(--mono); font-size: 12px; }
.badge { background: var(--warn); color: var(--panel); font-size: 10.5px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px; font-variant-numeric: tabular-nums; }
.only-narrow { display: none; }

/* ---------- ferramentas ---------- */
.tools {
  grid-area: tools; display: flex; gap: 16px; align-items: center; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--panel-2);
  padding-block: 5px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tgroup { display: flex; align-items: center; gap: 1px; flex: none; }
.tgroup + .tgroup { border-left: 1px solid var(--line); padding-left: 12px; }
@media (max-width: 1560px) { .tgroup > b { display: none; } .tools { gap: 12px; } }
.tgroup > b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin-right: 6px; writing-mode: horizontal-tb; }
.tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px; padding: 5px 4px 4px; border: 1px solid transparent;
  border-radius: 6px; background: none; cursor: pointer; font-size: 10.5px; color: var(--muted); position: relative; white-space: nowrap;
}
.tool svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; color: var(--ink); }
.tool:hover { background: var(--panel); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--panel); border-color: var(--accent); color: var(--accent); }
.tool[aria-pressed="true"] svg { stroke: var(--accent); color: var(--accent); }
.tool.locked::after { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- painéis laterais ---------- */
.side { background: var(--panel); overflow-y: auto; min-height: 0; }
.left { grid-area: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.right { grid-area: right; border-left: 1px solid var(--line); }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 9px; min-width: 0; }
.sec h3 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec h3 small { font-family: var(--mono); letter-spacing: 0; }
.left .sec:last-child { border-bottom: 0; flex: 1; align-content: start; }
.iconbtn { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1; color: var(--ink); }
.iconbtn:hover { background: var(--panel-2); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; min-width: 0; }
.item:hover { background: var(--panel-2); }
.item.on { background: var(--accent-soft); }
.item.off span { color: var(--muted); font-style: italic; }
.item svg { width: 15px; height: 15px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.item.on svg { stroke: var(--accent); color: var(--accent); }
.item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.item small { color: var(--muted); font-family: var(--mono); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
.list .empty { color: var(--muted); font-size: 12px; padding: 4px 8px; }
#search { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; outline: none; }
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.relrow { display: flex; align-items: center; gap: 4px; }

.p-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.p-head svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; color: var(--accent); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 11.5px; color: var(--muted); }
.field input, .field textarea, .field select, .minput {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; outline: none; min-width: 0;
}
.field input:focus, .field textarea:focus, .field select:focus, .minput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.role-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.check { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.hint { font-size: 11.5px; color: var(--muted); margin: 0; }
.hint.err { color: var(--danger); }
.hint code, kbd { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.p-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.banner { display: grid; gap: 8px; background: var(--accent-soft); border-radius: 6px; padding: 10px; font-size: 12px; }
.banner .btn { justify-self: start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 12px; background: none; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 12px; align-items: baseline; margin: 0; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
.meta b { color: var(--ink); font-weight: 600; font-family: var(--mono); }

.mlist { display: grid; gap: 4px; }
.mrow { display: flex; gap: 3px; align-items: center; min-width: 0; }
.minput { font-family: var(--mono); font-size: 12px; padding: 5px 7px; flex: 1; }
.mt {
  flex: none; width: 24px; height: 26px; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer;
  font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: grid; place-items: center; padding: 0;
}
.mt:hover { background: var(--panel-2); color: var(--ink); }
.mt.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mt.del:hover { color: var(--danger); }
.mt:disabled { opacity: .35; cursor: default; background: none; }

.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; background: var(--shape-fill); }
.sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw-none { background: linear-gradient(135deg, var(--shape-fill) 45%, var(--line) 46%, var(--line) 54%, var(--shape-fill) 55%); }
.sw-teal { background: var(--h-teal); } .sw-blue { background: var(--h-blue); } .sw-amber { background: var(--h-amber); }
.sw-rose { background: var(--h-rose); } .sw-violet { background: var(--h-violet); } .sw-slate { background: var(--h-slate); }

/* ---------- folha ---------- */
.canvas {
  grid-area: canvas; position: relative; overflow: hidden; min-width: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
}
#svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
#svg.c-create { cursor: crosshair; }
#svg.c-pan { cursor: grab; }
#svg.panning { cursor: grabbing; }
.status { position: absolute; left: 12px; bottom: 10px; right: 204px; display: flex; gap: 8px; align-items: center; pointer-events: none; font-size: 11.5px; color: var(--muted); }
.status > * { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; }
#hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#miniBtn { pointer-events: auto; cursor: pointer; flex: none; color: var(--muted); font-size: 11.5px; }
#miniBtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.mini { position: absolute; right: 12px; bottom: 10px; width: 180px; height: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; touch-action: none; }
.mm-node { fill: var(--muted); opacity: .45; }
.mm-node.pk { fill: none; stroke: var(--muted); stroke-width: 1; }
.mm-view { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 7px 14px;
  border-radius: 6px; font-size: 12.5px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; z-index: 5;
}
.toast.show { opacity: 1; }
.inline-ed {
  position: absolute; z-index: 6; box-sizing: border-box; border: 1.5px solid var(--accent); border-radius: 3px; background: var(--shape-fill);
  color: var(--ink); padding: 0 4px; outline: none; box-shadow: 0 0 0 4px var(--accent-soft); font-family: var(--mono); min-height: 20px;
}
.inline-ed.is-name { font-family: var(--ui); font-weight: 600; text-align: center; }
.inline-ed.is-note { font-family: var(--ui); background: var(--note-fill); padding: 6px 9px; resize: none; line-height: 1.28; }

/* ---------- elementos do diagrama ---------- */
.shape { fill: var(--shape-fill); stroke: var(--ink); stroke-width: 1.25; }
.head { fill: var(--shape-head); }
.div, .ul { stroke: var(--ink); stroke-width: 1; fill: none; }
.ul { pointer-events: none; }
.t-name { font-family: var(--ui); font-size: 13px; font-weight: 600; fill: var(--ink); }
.it { font-style: italic; }
.t-st { font-family: var(--ui); font-size: 11px; fill: var(--muted); }
.t-mem { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.t-plain { font-family: var(--ui); font-size: 13px; fill: var(--ink); }
.t-note { font-family: var(--ui); font-size: 12.5px; fill: var(--ink); }
.note-shape { fill: var(--note-fill); stroke: var(--note-stroke); stroke-width: 1.25; }
.note-fold { fill: none; stroke: var(--note-stroke); stroke-width: 1.25; }
.pkg { fill: var(--pkg-fill); stroke: var(--ink); stroke-width: 1.25; }
.tp-box { fill: var(--shape-fill); stroke: var(--ink); stroke-width: 1; stroke-dasharray: 4 3; }
.qual { fill: var(--shape-fill); stroke: var(--ink); stroke-width: 1.25; }
.t-qual { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.hitbox { fill: transparent; }
.node { cursor: move; }
.col-teal .shape { fill: var(--c-teal); } .col-teal .head { fill: var(--h-teal); }
.col-blue .shape { fill: var(--c-blue); } .col-blue .head { fill: var(--h-blue); }
.col-amber .shape { fill: var(--c-amber); } .col-amber .head { fill: var(--h-amber); }
.col-rose .shape { fill: var(--c-rose); } .col-rose .head { fill: var(--h-rose); }
.col-violet .shape { fill: var(--c-violet); } .col-violet .head { fill: var(--h-violet); }
.col-slate .shape { fill: var(--c-slate); } .col-slate .head { fill: var(--h-slate); }
.col-teal .note-shape { fill: var(--c-teal); } .col-blue .note-shape { fill: var(--c-blue); } .col-rose .note-shape { fill: var(--c-rose); }
.col-violet .note-shape { fill: var(--c-violet); } .col-slate .note-shape { fill: var(--c-slate); }
.e-line { fill: none; stroke: var(--ink); stroke-width: 1.25; }
.e-line.dash { stroke-dasharray: 6 4; }
.edge.sel .e-line, .edge.sel .mk-open, .edge.sel .mk-hollow { stroke: var(--accent); }
.edge.sel .mk-fill { fill: var(--accent); stroke: var(--accent); }
.edge.sel .e-line { stroke-width: 2; }
.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.t-edge { font-family: var(--ui); font-size: 11.5px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; cursor: grab; }
.t-mult { font-family: var(--mono); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; cursor: grab; }
.mk-hollow { fill: var(--shape-fill); stroke: var(--ink); stroke-width: 1.25; stroke-linejoin: round; }
.mk-fill { fill: var(--ink); stroke: var(--ink); stroke-width: 1.25; stroke-linejoin: round; }
.mk-open { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
.sel-box { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }
.handle { fill: var(--accent); cursor: nwse-resize; }
.h-ep { fill: var(--panel); stroke: var(--accent); stroke-width: 2; cursor: crosshair; }
.h-wp { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; cursor: move; }
.h-mid { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; cursor: copy; opacity: .85; }
.temp { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; pointer-events: none; }
.marquee { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; pointer-events: none; }
.target .shape, .target .note-shape, .target .pkg { stroke: var(--accent); stroke-width: 2.5; }

/* ---------- menu de contexto ---------- */
.menu {
  position: fixed; z-index: 60; min-width: 220px; max-width: calc(100vw - 16px); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow); padding: 5px; display: grid;
}
.menu button[role="menuitem"] {
  display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 0; background: none; text-align: left;
  padding: 6px 10px; border-radius: 5px; cursor: pointer;
}
.menu button[role="menuitem"]:hover, .menu button[role="menuitem"]:focus-visible { background: var(--panel-2); outline: none; }
.menu button.danger { color: var(--danger); }
.menu button:disabled { opacity: .4; cursor: default; background: none; }
.menu kbd { font-size: 10.5px; color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.menu .swatches { padding: 6px 8px; }

/* ---------- janelas ---------- */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50; padding: 16px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: var(--shadow); }
.sheet.wide { width: min(880px, 100%); }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.sheet h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet .body { padding: 16px 18px; display: grid; gap: 12px; }
.sheet .body > p { margin: 0; }
textarea.code {
  width: 100%; box-sizing: border-box; min-height: 200px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 10px; resize: vertical; tab-size: 4;
}
textarea.code.tall { min-height: 340px; }
textarea.code.short { min-height: 110px; }
.preview { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px; text-align: center; overflow: auto; max-height: 46vh; }
.preview img { max-width: 100%; height: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; justify-self: start; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.issues button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.issues button:hover { background: var(--panel-2); }
.pill { flex: none; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
.pill.error { color: var(--danger); } .pill.warning { color: var(--warn); } .pill.info { color: var(--info); }
.ok-msg { margin: 0; padding: 14px; border-radius: 6px; background: var(--accent-soft); }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "tools" "canvas"; }
  .side {
    position: fixed; top: 0; bottom: 0; width: min(88vw, 340px); z-index: 40; transition: transform .22s ease; box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .left { left: 0; transform: translateX(-105%); }
  .right { right: 0; transform: translateX(105%); }
  .side.open { transform: none; }
  .scrim.on { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 35; }
  .only-narrow { display: inline-flex; }
  .crumb, .wide-only { display: none; }
  .tool { min-width: 50px; }
  .status { right: 12px; }
  #miniBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) { .side, .toast { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="11" height="10" rx="1"/><path d="M3 7h11"/><rect x="12" y="15" width="9" height="6" rx="1"/><path d="M8.5 13v5H12"/></svg>
      NextUML
    </div>
    <div class="crumb" id="crumb"></div>
    <nav class="actions" aria-label="Ações">
      <button class="btn only-narrow" data-cmd="toggle-left" title="Diagramas e modelo"><svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
      <button class="btn only-narrow" data-cmd="toggle-right" title="Propriedades"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 14h12"/><circle cx="8" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg></button>
      <button class="btn" data-cmd="new" title="Novo projeto"><svg viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5"/></svg><span class="wide-only">Novo</span></button>
      <button class="btn" data-cmd="open" title="Abrir projeto"><svg viewBox="0 0 20 20"><path d="M2.5 5.5h5l1.5 2h8.5v8.5h-15z"/></svg><span class="wide-only">Abrir</span></button>
      <button class="btn" data-cmd="save" title="Salvar projeto (Ctrl+S)"><svg viewBox="0 0 20 20"><path d="M4 3h10l2.5 2.5V17H4z"/><path d="M7 3v4h6V3M7 17v-5h6v5"/></svg><span class="wide-only">Salvar</span></button>
      <button class="btn" data-menu="export" aria-haspopup="menu" title="Exportar imagem, XMI ou JSON"><svg viewBox="0 0 20 20"><path d="M10 3v9M6 8l4 4 4-4M4 15.5h12"/></svg><span>Exportar</span><svg class="caret" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></svg></button>
      <button class="btn" data-menu="code" aria-haspopup="menu" title="Gerar ou importar código"><svg viewBox="0 0 20 20"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4"/></svg><span>Código</span><svg class="caret" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></svg></button>
      <button class="btn" data-cmd="validate" title="Verificar consistência do modelo"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg><span class="wide-only">Verificar</span><span class="badge" id="issueBadge" hidden></span></button>
      <span class="sep"></span>
      <button class="btn" data-cmd="undo" id="bUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 20 20"><path d="M7.5 5L4 8.5 7.5 12"/><path d="M4 8.5h8a4 4 0 010 8H9"/></svg></button>
      <button class="btn" data-cmd="redo" id="bRedo" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 20 20"><path d="M12.5 5L16 8.5 12.5 12"/><path d="M16 8.5H8a4 4 0 000 8h3"/></svg></button>
      <span class="sep"></span>
      <button class="btn" data-cmd="zoom-out" title="Afastar (-)" aria-label="Afastar"><svg viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
      <button class="btn zoom" data-cmd="zoom-reset" id="zoomLbl" title="Voltar a 100%">100%</button>
      <button class="btn" data-cmd="zoom-in" title="Aproximar (+)" aria-label="Aproximar"><svg viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button>
      <button class="btn outline" data-cmd="fit" title="Enquadrar o diagrama (0)"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg><span class="wide-only">Enquadrar</span></button>
    </nav>
  </header>

  <div class="tools" id="tools" role="toolbar" aria-label="Ferramentas"></div>

  <aside class="side left" id="left" aria-label="Navegador do modelo">
    <div class="sec">
      <h3>Diagramas <button class="iconbtn" data-cmd="new-diagram" title="Novo diagrama" aria-label="Novo diagrama">+</button></h3>
      <ul class="list" id="dlist"></ul>
    </div>
    <div class="sec">
      <h3>Modelo <button class="iconbtn" data-cmd="new-package" title="Novo pacote" aria-label="Novo pacote">+</button></h3>
      <input id="search" type="search" placeholder="Buscar classe, atributo… (Ctrl+F)" aria-label="Buscar no modelo" autocomplete="off">
      <div id="mtree"></div>
      <p class="hint">Itens em itálico estão fora deste diagrama. Arraste-os para a folha ou dê duplo clique.</p>
    </div>
  </aside>

  <main class="canvas" id="canvas">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Folha de desenho"><g id="vp"></g></svg>
    <div class="status"><span id="hint"></span><button id="miniBtn" type="button" aria-pressed="true" title="Mostrar ou ocultar o minimapa">Minimapa</button></div>
    <svg id="mini" class="mini" aria-label="Minimapa"></svg>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="side right" id="right" aria-label="Propriedades"><div id="props"></div></aside>
  <div class="scrim" id="scrim"></div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2><button class="btn" data-close title="Fechar" aria-label="Fechar"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button></header>
    <div class="body" id="mBody"></div>
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<datalist id="multList"><option value="1"></option><option value="0..1"></option><option value="0..*"></option><option value="1..*"></option><option value="*"></option></datalist>
<datalist id="stList"><option value="entity"></option><option value="boundary"></option><option value="control"></option><option value="service"></option><option value="repository"></option><option value="dto"></option><option value="utility"></option><option value="exception"></option></datalist>
<datalist id="depList"><option value="use"></option><option value="create"></option><option value="call"></option><option value="instantiate"></option><option value="import"></option><option value="access"></option></datalist>

<script>
/* NextUML — modelo de dados, sintaxe UML de membros, normalização e migração.
   Não depende do DOM: roda no navegador e no Node (testes). */
(function (G) {
  'use strict';
  const UML = (G.UML = G.UML || {});
  const uid = (UML.uid = () => Math.random().toString(36).slice(2, 10));

  UML.KINDS = {
    class: { label: 'Classe', classifier: true },
    interface: { label: 'Interface', classifier: true },
    enumeration: { label: 'Enumeração', classifier: true },
    datatype: { label: 'Tipo de dado', classifier: true },
    primitive: { label: 'Tipo primitivo', classifier: true },
    object: { label: 'Objeto' },
    package: { label: 'Pacote' },
    note: { label: 'Nota' },
    nary: { label: 'Associação n-ária' },
  };
  UML.isClassifier = k => !!(UML.KINDS[k] && UML.KINDS[k].classifier);

  UML.REL = {
    association: { label: 'Associação' },
    generalization: { label: 'Generalização' },
    realization: { label: 'Realização' },
    dependency: { label: 'Dependência' },
    anchor: { label: 'Ligação de nota' },
  };

  UML.KNOWN_TYPES = new Set([
    'void', 'int', 'long', 'short', 'byte', 'float', 'double', 'boolean', 'char',
    'String', 'Integer', 'Long', 'Short', 'Byte', 'Float', 'Double', 'Boolean', 'Character', 'Object',
    'Date', 'LocalDate', 'LocalDateTime', 'LocalTime', 'Instant', 'Duration', 'BigDecimal', 'BigInteger', 'UUID',
    'List', 'Set', 'Map', 'Collection', 'Optional', 'Iterable', 'ArrayList', 'HashMap', 'HashSet',
    'number', 'string', 'any', 'unknown', 'never', 'Array', 'Promise', 'Record', 'Readonly',
    'str', 'bool', 'float', 'list', 'dict', 'set', 'tuple', 'None', 'Decimal', 'datetime', 'date',
  ]);

  /* ---------- varredura respeitando aninhamento e aspas ---------- */
  function topLevel(s, test) {
    let depth = 0, q = null;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (q) { if (ch === q) q = null; continue; }
      if (ch === '"' || ch === "'") { q = ch; continue; }
      if (ch === '<' || ch === '(' || ch === '[' || ch === '{') { depth++; continue; }
      if (ch === '>' || ch === ')' || ch === ']' || ch === '}') { if (ch === '>' && s[i - 1] === '=') continue; depth = Math.max(0, depth - 1); continue; }
      if (depth === 0 && test(ch, i, s)) return i;
    }
    return -1;
  }
  UML.topLevel = topLevel;
  UML.splitTop = function (s, sep) {
    const out = [];
    let rest = String(s || '');
    for (;;) {
      const i = topLevel(rest, ch => ch === sep);
      if (i < 0) { out.push(rest); break; }
      out.push(rest.slice(0, i));
      rest = rest.slice(i + 1);
    }
    return out.map(x => x.trim()).filter(Boolean);
  };
  const isEq = (ch, i, s) => ch === '=' && s[i + 1] !== '>' && s[i + 1] !== '=' && s[i - 1] !== '=' && s[i - 1] !== '!';

  /* ---------- sintaxe UML: atributos, parâmetros, operações ---------- */
  UML.parseAttr = function (src) {
    let t = String(src || '').trim();
    const a = { vis: '', name: '', type: '', mult: '', def: '', derived: false, readOnly: false, props: '' };
    const vm = t.match(/^([+\-#~])\s*/);
    if (vm) { a.vis = vm[1]; t = t.slice(vm[0].length); }
    if (t[0] === '/') { a.derived = true; t = t.slice(1).trim(); }
    const pm = t.match(/\{([^{}]*)\}\s*$/);
    if (pm) {
      const ps = pm[1].split(',').map(x => x.trim()).filter(Boolean);
      a.readOnly = ps.includes('readOnly');
      a.props = ps.filter(x => x !== 'readOnly').join(', ');
      t = t.slice(0, pm.index).trim();
    }
    const eq = topLevel(t, isEq);
    if (eq >= 0) { a.def = t.slice(eq + 1).trim(); t = t.slice(0, eq).trim(); }
    const mm = t.match(/\[([^\]]+)\]\s*$/);
    if (mm) { a.mult = mm[1].trim(); t = t.slice(0, mm.index).trim(); }
    const c = topLevel(t, ch => ch === ':');
    if (c >= 0) { a.type = t.slice(c + 1).trim(); t = t.slice(0, c).trim(); }
    a.name = t;
    return a;
  };

  function parseParam(src) {
    let t = String(src || '').trim();
    const p = { dir: '', name: '', type: '', mult: '', def: '' };
    const dm = t.match(/^(in|out|inout)\s+/);
    if (dm) { p.dir = dm[1]; t = t.slice(dm[0].length); }
    const eq = topLevel(t, isEq);
    if (eq >= 0) { p.def = t.slice(eq + 1).trim(); t = t.slice(0, eq).trim(); }
    const mm = t.match(/\[([^\]]+)\]\s*$/);
    if (mm) { p.mult = mm[1].trim(); t = t.slice(0, mm.index).trim(); }
    const c = topLevel(t, ch => ch === ':');
    if (c >= 0) { p.name = t.slice(0, c).trim(); p.type = t.slice(c + 1).trim(); }
    else {
      const jm = t.match(/^(.+?)\s+([A-Za-z_$][\w$]*)$/);
      if (jm) { p.type = jm[1].trim(); p.name = jm[2]; } else p.name = t;
    }
    if (p.name.endsWith('?')) { p.name = p.name.slice(0, -1); if (!p.mult) p.mult = '0..1'; }
    return p;
  }
  UML.parseParam = parseParam;

  UML.parseOp = function (src) {
    let t = String(src || '').trim();
    const o = { vis: '', name: '', params: [], ret: '', retMult: '', props: '' };
    const vm = t.match(/^([+\-#~])\s*/);
    if (vm) { o.vis = vm[1]; t = t.slice(vm[0].length); }
    const pm = t.match(/\{([^{}]*)\}\s*$/);
    if (pm) { o.props = pm[1].trim(); t = t.slice(0, pm.index).trim(); }
    const open = t.indexOf('(');
    if (open < 0) {
      const c = topLevel(t, ch => ch === ':');
      if (c >= 0) { o.ret = t.slice(c + 1).trim(); t = t.slice(0, c).trim(); }
      o.name = t;
      return o;
    }
    o.name = t.slice(0, open).trim();
    let depth = 0, close = -1;
    for (let i = open; i < t.length; i++) {
      if (t[i] === '(') depth++;
      else if (t[i] === ')') { depth--; if (depth === 0) { close = i; break; } }
    }
    const inner = t.slice(open + 1, close < 0 ? t.length : close);
    const rest = close < 0 ? '' : t.slice(close + 1).trim();
    if (rest[0] === ':') o.ret = rest.slice(1).trim();
    const rm = o.ret.match(/\s*\[([^\]]+)\]\s*$/);
    if (rm) { o.retMult = rm[1].trim(); o.ret = o.ret.slice(0, rm.index).trim(); }
    o.params = UML.splitTop(inner, ',').map(parseParam).filter(p => p.name || p.type);
    return o;
  };

  UML.parseSlot = function (src) {
    const t = String(src || '');
    const i = t.indexOf('=');
    return i < 0 ? { feature: t.trim(), value: '' } : { feature: t.slice(0, i).trim(), value: t.slice(i + 1).trim() };
  };

  UML.fmtAttr = function (a, o = {}) {
    let s = (!o.hideVis && a.vis ? a.vis + ' ' : '') + (a.derived ? '/' : '') + a.name;
    if (!o.hideTypes) {
      if (a.type) s += ': ' + a.type;
      if (a.mult) s += ' [' + a.mult + ']';
      if (a.def !== '' && a.def != null) s += ' = ' + a.def;
      const props = [a.readOnly ? 'readOnly' : '', a.props].filter(Boolean).join(', ');
      if (props) s += ' {' + props + '}';
    }
    return s;
  };
  UML.fmtParam = function (p, o = {}) {
    let s = (p.dir && p.dir !== 'in' ? p.dir + ' ' : '') + (p.name || '');
    if (!o.hideTypes) {
      if (p.type) s += (p.name ? ': ' : '') + p.type;
      if (p.mult) s += '[' + p.mult + ']';
      if (p.def) s += ' = ' + p.def;
    } else if (!p.name) s += p.type;
    return s;
  };
  UML.fmtOp = function (op, o = {}) {
    let s = (!o.hideVis && op.vis ? op.vis + ' ' : '') + op.name + '(' + op.params.map(p => UML.fmtParam(p, o)).join(', ') + ')';
    if (!o.hideTypes) {
      if (op.ret) s += ': ' + op.ret + (op.retMult ? ' [' + op.retMult + ']' : '');
      if (op.props) s += ' {' + op.props + '}';
    }
    return s;
  };
  UML.fmtSlot = s => s.feature + ' = ' + (s.value || '');

  UML.multBounds = function (m) {
    m = String(m || '').trim();
    if (!m) return null;
    if (m === '*') return { lower: 0, upper: Infinity };
    const parts = m.split('..');
    const lo = parts[0].trim(), hi = (parts.length > 1 ? parts[1] : parts[0]).trim();
    const num = x => (x === '*' || x === 'n' ? Infinity : (isNaN(parseInt(x, 10)) ? 1 : parseInt(x, 10)));
    return { lower: lo === '*' ? 0 : num(lo), upper: num(hi) };
  };
  UML.isMany = m => { const b = UML.multBounds(m); return !!b && b.upper > 1; };
  UML.isOptional = m => { const b = UML.multBounds(m); return !!b && b.lower === 0 && b.upper === 1; };
  UML.typeIds = t => String(t || '').match(/[A-Za-z_$][\w$]*/g) || [];

  /* ---------- fábricas ---------- */
  UML.attr = (text, extra) => Object.assign({ id: uid(), isStatic: false }, UML.parseAttr(text), extra);
  UML.op = (text, extra) => Object.assign({ id: uid(), isStatic: false, isAbstract: false }, UML.parseOp(text), extra);
  UML.lit = name => ({ id: uid(), name: String(name || '').trim() });
  UML.slot = text => Object.assign({ id: uid() }, UML.parseSlot(text));
  UML.end = () => ({ role: '', vis: '', mult: '', nav: '', agg: 'none', constraint: '', qualifier: '' });

  UML.newElement = function (kind, name) {
    const e = { id: uid(), kind, name: name == null ? '' : String(name), package: null, stereotype: '', doc: '' };
    if (UML.isClassifier(kind)) Object.assign(e, { attributes: [], operations: [], literals: [], isAbstract: false, isLeaf: false, templateParams: '' });
    if (kind === 'object') Object.assign(e, { classifier: null, classifierName: '', slots: [] });
    if (kind === 'note') e.text = '';
    return e;
  };
  UML.newRelation = (kind, source, target) => ({
    id: uid(), kind, source, target, name: '', stereotype: '', ends: [UML.end(), UML.end()], assocClass: null,
  });
  UML.newView = (ref, x, y) => ({ id: uid(), ref, x: Math.round(x || 0), y: Math.round(y || 0), w: 0, h: 0, hideAttrs: false, hideOps: false, color: '', lollipop: false });
  UML.newEdgeView = ref => ({ id: uid(), ref, points: [], style: 'straight', labels: {} });
  UML.newDiagram = name => ({ id: uid(), name: name || 'Diagrama de classes', views: [], edges: [], view: { x: 60, y: 60, z: 1 }, opts: { hideVis: false, hideTypes: false } });
  UML.newProject = function () {
    const d = UML.newDiagram('Diagrama de classes');
    return { version: 2, name: 'Projeto sem título', elements: {}, relations: {}, diagrams: [d], current: d.id };
  };

  /* ---------- consultas ---------- */
  UML.qualifiedPackage = function (p, pkgId) {
    const names = [];
    const seen = new Set();
    let id = pkgId;
    while (id && p.elements[id] && !seen.has(id)) { seen.add(id); names.unshift(p.elements[id].name); id = p.elements[id].package; }
    return names.join('.');
  };
  UML.classifierByName = (p, name) => Object.values(p.elements).find(e => UML.isClassifier(e.kind) && e.name === name) || null;
  UML.relationsOf = (p, id) => Object.values(p.relations).filter(r => r.source === id || r.target === id || r.assocClass === id);
  UML.parentsOf = (p, id, kinds = ['generalization']) =>
    Object.values(p.relations).filter(r => kinds.includes(r.kind) && r.source === id).map(r => p.elements[r.target]).filter(Boolean);
  UML.ancestors = function (p, id) {
    const out = [], seen = new Set([id]);
    const walk = x => UML.parentsOf(p, x).forEach(e => { if (!seen.has(e.id)) { seen.add(e.id); out.push(e); walk(e.id); } });
    walk(id);
    return out;
  };
  UML.isDescendantPackage = function (p, pkgId, maybeChild) {
    let id = maybeChild; const seen = new Set();
    while (id && !seen.has(id)) { if (id === pkgId) return true; seen.add(id); id = p.elements[id] && p.elements[id].package; }
    return false;
  };

  /* ---------- normalização e migração ---------- */
  const fill = (obj, defs) => { for (const k in defs) if (obj[k] === undefined || obj[k] === null && defs[k] !== null) obj[k] = defs[k]; return obj; };

  UML.normalize = function (p) {
    if (!p || typeof p !== 'object') throw new Error('Conteúdo vazio ou inválido.');
    if (Array.isArray(p.diagrams) && p.diagrams.some(d => Array.isArray(d.nodes))) p = UML.migrateV1(p);
    if (!p.elements || typeof p.elements !== 'object' || !Array.isArray(p.diagrams)) throw new Error('O arquivo não parece ser um projeto do NextUML.');
    p.version = 2;
    p.name = p.name || 'Projeto';
    p.relations = p.relations && typeof p.relations === 'object' ? p.relations : {};
    for (const [id, e] of Object.entries(p.elements)) {

    const repoLivros = cls('class', 'RepositorioLivros', per, ['- livros: Map<String, Livro>'], ['+ buscarPorIsbn(isbn: String): Livro', '+ salvar(item: Livro): void', '+ buscarPorId(id: String): Livro', '+ listar(): List<Livro>']);

  }
  const genParents = (p, c, kind) => Object.values(p.relations).filter(r => r.kind === kind && r.source === c.id).map(r => p.elements[r.target]).filter(e => e && UML.isClassifier(e.kind));
  const docLines = (doc, pre) => (doc ? doc.split('\n').map(l => pre + l) : []);
  const selected = (p, ids) => classifiers(p).filter(c => c.kind !== 'primitive' && (!ids || ids.has(c.id)));
  const BOX = { int: 'Integer', long: 'Long', double: 'Double', float: 'Float', boolean: 'Boolean', char: 'Character', short: 'Short', byte: 'Byte' };

  /* ---------- Java ---------- */
  const JV = { '+': 'public ', '-': 'private ', '#': 'protected ', '~': '', '': 'private ' };
  const jType = (t, many, ordered) => {
    let base = String(t || 'Object').replace(/\bstring\b/g, 'String').replace(/\bnumber\b/g, 'double').replace(/\bbool\b/g, 'boolean');
    if (many) return `${ordered === false ? 'Set' : 'List'}<${BOX[base] || base}>`;
    return base;
  };
  const jReturn = t => {
    if (!t || t === 'void') return '';
    if (/^(int|long|short|byte|double|float)$/.test(t)) return 'return 0;';
    if (t === 'boolean') return 'return false;';
    if (t === 'char') return "return '\\0';";
    return 'return null;';
  };
  function genJavaOne(p, c) {
    const L = [];
    const pkg = UML.qualifiedPackage(p, c.package);
    const supers = genParents(p, c, 'generalization'), reals = genParents(p, c, 'realization');
    const assoc = assocFields(p, c);
    const iface = c.kind === 'interface', isEnum = c.kind === 'enumeration';
    const texts = [...c.attributes.map(a => a.type), ...c.operations.flatMap(o => [o.ret, ...o.params.map(x => x.type)]), ...assoc.map(a => a.type)].join(' ');
    const imports = new Set();
    if (/\b(List)\b/.test(texts) || c.attributes.some(a => UML.isMany(a.mult)) || assoc.some(a => a.many)) { imports.add('java.util.List'); imports.add('java.util.ArrayList'); }
    if (/\bSet\b/.test(texts)) imports.add('java.util.Set');
    if (/\bMap\b/.test(texts) || assoc.some(a => a.qualifier)) { imports.add('java.util.Map'); imports.add('java.util.HashMap'); }
    for (const t of ['LocalDate', 'LocalDateTime', 'LocalTime', 'Instant', 'Duration']) if (new RegExp('\\b' + t + '\\b').test(texts)) imports.add('java.time.' + t);
    if (/\bBigDecimal\b/.test(texts)) imports.add('java.math.BigDecimal');
    if (/\bUUID\b/.test(texts)) imports.add('java.util.UUID');
    if (/\bDate\b/.test(texts)) imports.add('java.util.Date');
    for (const id of new Set([...UML.typeIds(texts), ...supers.map(s => s.name), ...reals.map(s => s.name)])) {
      const other = UML.classifierByName(p, id);
      if (other && other.id !== c.id && other.package !== c.package && other.package) imports.add(UML.qualifiedPackage(p, other.package) + '.' + other.name);
    }
    if (pkg) L.push(`package ${pkg};`, '');
    if (imports.size) { L.push(...[...imports].sort().map(i => `import ${i};`), ''); }
    if (c.doc || c.stereotype) L.push('/**', ...docLines(c.doc, ' * '), ...(c.stereotype ? [` * @stereotype ${c.stereotype}`] : []), ' */');
    const kw = iface ? 'interface' : isEnum ? 'enum' : 'class';
    let head = 'public ' + (c.kind === 'class' && c.isAbstract ? 'abstract ' : '') + (c.isLeaf && !iface && !isEnum ? 'final ' : '') + kw + ' ' + c.name + (c.templateParams ? `<${c.templateParams}>` : '');
    if (iface && supers.length) head += ' extends ' + supers.map(s => s.name).join(', ');
    if (!iface && !isEnum && supers.length) head += ' extends ' + supers[0].name;
    if (!iface && reals.length) head += ' implements ' + reals.map(s => s.name).join(', ');
    L.push(head + ' {');
    const body = [];
    if (isEnum) body.push('    ' + (c.literals.map(l => l.name).join(',\n    ') || '') + ';', '');
    for (const a of c.attributes) {
      const many = UML.isMany(a.mult);
      let def = a.def ? ' = ' + a.def : many && !iface ? ' = new ArrayList<>()' : '';
      if (isEnum && a.def && !a.isStatic) def = '';
      if (iface) body.push(`    ${jType(a.type, many)} ${a.name}${def || ' = null'};`);
      else body.push(`    ${JV[a.vis]}${a.isStatic ? 'static ' : ''}${a.readOnly ? 'final ' : ''}${jType(a.type, many)} ${a.name}${def};`);
    }
    for (const f of assoc) {
      if (f.qualifier) body.push(`    ${JV[f.vis]}Map<${BOX[f.qualifier.type] || f.qualifier.type}, ${f.type}> ${f.name} = new HashMap<>();`);
      else body.push(`    ${JV[f.vis]}${jType(f.type, f.many, f.ordered || undefined)} ${f.name}${f.many ? ' = new ArrayList<>()' : ''};`);
    }
    if (body.length && c.operations.length) body.push('');
    c.operations.forEach((o, i) => {
      if (i) body.push('');
      const params = o.params.map(x => `${jType(x.type || 'Object', UML.isMany(x.mult))} ${x.name || 'arg' + i}`).join(', ');
      const ret = o.ret ? jType(o.ret, UML.isMany(o.retMult)) : 'void';
      if (o.name === c.name) { body.push(`    ${JV[o.vis || '+']}${c.name}(${params}) {`, '        // TODO implementar', '    }'); return; }
      if (iface && !o.isStatic) { body.push(`    ${ret} ${o.name}(${params});`); return; }
      if (o.isAbstract) { body.push(`    ${JV[o.vis || '+']}abstract ${ret} ${o.name}(${params});`); return; }
      const r = jReturn(ret);
      body.push(`    ${iface ? 'public ' : JV[o.vis || '+']}${o.isStatic ? 'static ' : ''}${ret} ${o.name}(${params}) {`, '        // TODO implementar', ...(r ? ['        ' + r] : []), '    }');
    });
    L.push(...body, '}', '');
    const dir = pkg ? pkg.replace(/\./g, '/') + '/' : '';
    return { file: `${dir}${c.name}.java`, code: L.join('\n') };
  }

  /* ---------- TypeScript ---------- */
  const TS_MAP = {
    int: 'number', long: 'number', short: 'number', byte: 'number', float: 'number', double: 'number', BigDecimal: 'number', BigInteger: 'bigint',
    Integer: 'number', Long: 'number', Short: 'number', Byte: 'number', Float: 'number', Double: 'number',
    String: 'string', char: 'string', Character: 'string', UUID: 'string', str: 'string',
    boolean: 'boolean', Boolean: 'boolean', bool: 'boolean',
    Date: 'Date', LocalDate: 'Date', LocalDateTime: 'Date', Instant: 'Date', Object: 'unknown',
  };
  const tsType = (t, many) => {
    let s = String(t || 'unknown').replace(/[A-Za-z_$][\w$]*/g, id => TS_MAP[id] || id);
    s = s.replace(/\b(?:List|Collection|ArrayList|Iterable)<(.+)>$/, '$1[]');
    if (many) s = /[|&\s]/.test(s) ? `(${s})[]` : s + '[]';
    return s;
  };
  const TSV = { '+': 'public ', '-': 'private ', '#': 'protected ', '~': '', '': 'private ' };
  const tsDefault = t => (/^(number|bigint)$/.test(t) ? '0' : t === 'string' ? "''" : t === 'boolean' ? 'false' : null);
  function genTSOne(p, c) {
    const L = [];
    const supers = genParents(p, c, 'generalization'), reals = genParents(p, c, 'realization');
    const assoc = assocFields(p, c);
    const used = new Set();
    const note = t => UML.typeIds(t).forEach(id => { const o = UML.classifierByName(p, id); if (o && o.id !== c.id && o.kind !== 'primitive') used.add(o.name); });
    c.attributes.forEach(a => note(a.type)); c.operations.forEach(o => { note(o.ret); o.params.forEach(x => note(x.type)); });
    assoc.forEach(a => note(a.type)); supers.forEach(s => used.add(s.name)); reals.forEach(s => used.add(s.name));
    [...used].sort().forEach(n => L.push(`import { ${n} } from './${n}';`));
    if (used.size) L.push('');
    if (c.doc) L.push('/**', ...docLines(c.doc, ' * '), ' */');
    const tp = c.templateParams ? `<${c.templateParams}>` : '';
    if (c.kind === 'enumeration') {
      L.push(`export enum ${c.name} {`, ...c.literals.map(l => `  ${l.name} = '${l.name}',`), '}', '');
      return { file: c.name + '.ts', code: L.join('\n') };
    }
    const asInterface = c.kind === 'interface' || c.kind === 'datatype';
    const params = o => o.params.map((x, i) => `${x.name || 'arg' + i}${UML.isOptional(x.mult) ? '?' : ''}: ${tsType(x.type, UML.isMany(x.mult))}${x.def ? ' = ' + x.def : ''}`).join(', ');
    if (asInterface) {
      const ext = [...supers, ...(c.kind === 'datatype' ? [] : [])].map(s => s.name);
      L.push(`export interface ${c.name}${tp}${ext.length ? ' extends ' + ext.join(', ') : ''} {`);
      c.attributes.forEach(a => L.push(`  ${a.readOnly ? 'readonly ' : ''}${a.name}${UML.isOptional(a.mult) ? '?' : ''}: ${tsType(a.type, UML.isMany(a.mult))};`));
      assoc.forEach(f => L.push(`  ${f.name}${f.optional ? '?' : ''}: ${f.qualifier ? `Map<${tsType(f.qualifier.type)}, ${f.type}>` : tsType(f.type, f.many)};`));
      c.operations.filter(o => !o.isStatic).forEach(o => L.push(`  ${o.name}(${params(o).replace(/ = [^,)]+/g, '')}): ${o.ret ? tsType(o.ret, UML.isMany(o.retMult)) + (UML.isOptional(o.retMult) ? ' | null' : '') : 'void'};`));
      L.push('}', '');
      return { file: c.name + '.ts', code: L.join('\n') };
    }
    let head = `export ${c.isAbstract ? 'abstract ' : ''}class ${c.name}${tp}`;
    if (supers.length) head += ' extends ' + supers[0].name;
    if (reals.length) head += ' implements ' + reals.map(s => s.name).join(', ');
    L.push(head + ' {');
    for (const a of c.attributes) {
      const t = tsType(a.type, UML.isMany(a.mult));
      const def = a.def ? ' = ' + a.def.replace(/^(DISPONIVEL|[A-Z_]+)$/, m => (UML.classifierByName(p, a.type) ? `${a.type}.${m}` : m)) : UML.isMany(a.mult) ? ' = []' : '';
      const opt = UML.isOptional(a.mult) ? '?' : !def && !a.isStatic ? '!' : '';
      L.push(`  ${TSV[a.vis]}${a.isStatic ? 'static ' : ''}${a.readOnly ? 'readonly ' : ''}${a.name}${opt}: ${t}${def};`);
    }
    for (const f of assoc) {
      if (f.qualifier) L.push(`  ${TSV[f.vis]}${f.name} = new Map<${tsType(f.qualifier.type)}, ${f.type}>();`);
      else L.push(`  ${TSV[f.vis]}${f.name}${f.many ? '' : f.optional ? '?' : '!'}: ${tsType(f.type, f.many)}${f.many ? ' = []' : ''};`);
    }
    c.operations.forEach(o => {
      L.push('');
      const ret = o.ret ? tsType(o.ret, UML.isMany(o.retMult)) + (UML.isOptional(o.retMult) ? ' | null' : '') : 'void';
      if (o.name === c.name || o.name === 'constructor') { L.push(`  constructor(${params(o)}) {`, supers.length ? '    super();' : '    // TODO implementar', '  }'); return; }
      if (o.isAbstract) { L.push(`  ${TSV[o.vis || '+']}abstract ${o.name}(${params(o).replace(/ = [^,)]+/g, '')}): ${ret};`); return; }
      L.push(`  ${TSV[o.vis || '+']}${o.isStatic ? 'static ' : ''}${o.name}(${params(o)}): ${ret} {`, "    throw new Error('Não implementado');", '  }');
    });
    L.push('}', '');
    void tsDefault;
    return { file: c.name + '.ts', code: L.join('\n') };
  }

  /* ---------- Python ---------- */
  const PY_MAP = {
    int: 'int', long: 'int', short: 'int', byte: 'int', Integer: 'int', Long: 'int', BigInteger: 'int', number: 'float',
    double: 'float', float: 'float', Double: 'float', Float: 'float', BigDecimal: 'Decimal',
    String: 'str', string: 'str', char: 'str', Character: 'str', UUID: 'UUID',
    boolean: 'bool', Boolean: 'bool', LocalDate: 'date', Date: 'date', LocalDateTime: 'datetime', Instant: 'datetime', Object: 'object', void: 'None',
  };
  const pyType = (t, many) => {
    let s = String(t || 'object').replace(/[A-Za-z_$][\w$]*/g, id => PY_MAP[id] || id);
    s = s.replace(/\b(?:List|Collection|ArrayList|Iterable)<(.+)>$/, 'list[$1]').replace(/\bSet<(.+)>$/, 'set[$1]').replace(/\bMap<(.+)>$/, 'dict[$1]').replace(/</g, '[').replace(/>/g, ']');
    return many ? `list[${s}]` : s;
  };
  const snake = s => s.replace(/([a-z0-9])([A-Z])/g, '$1_$2').toLowerCase();
  const pyName = (n, vis) => (vis === '-' || vis === '#' ? '_' : '') + snake(n);
  const pyDef = d => {
    if (d == null || d === '') return 'None';
    if (d === 'true') return 'True'; if (d === 'false') return 'False'; if (d === 'null') return 'None';
    if (/^new\s/.test(d)) return 'None';
    return d;
  };
  function genPyOne(p, c) {
    const L = [];
    const supers = genParents(p, c, 'generalization'), reals = genParents(p, c, 'realization');
    const assoc = assocFields(p, c);
    const texts = [...c.attributes.map(a => a.type), ...c.operations.flatMap(o => [o.ret, ...o.params.map(x => x.type)])].map(t => pyType(t)).join(' ');
    const abstract = c.kind === 'interface' || c.isAbstract || c.operations.some(o => o.isAbstract);
    L.push('from __future__ import annotations', '');
    const imp = [];
    if (abstract) imp.push('from abc import ABC, abstractmethod');
    if (c.kind === 'datatype') imp.push('from dataclasses import dataclass');
    if (c.kind === 'enumeration') imp.push('from enum import Enum, auto');
    if (/\bDecimal\b/.test(texts)) imp.push('from decimal import Decimal');
    const dt = ['date', 'datetime'].filter(x => new RegExp('\\b' + x + '\\b').test(texts));
    if (dt.length) imp.push(`from datetime import ${dt.join(', ')}`);
    if (/\bUUID\b/.test(texts)) imp.push('from uuid import UUID');
    [...supers, ...reals].forEach(s => imp.push(`from .${snake(s.name)} import ${s.name}`));
    if (imp.length) L.push(...imp, '');
    L.push('');
    const bases = [...supers, ...reals].map(s => s.name);
    if (c.kind === 'enumeration') bases.unshift('Enum');
    else if (abstract && !bases.length) bases.push('ABC');
    if (c.kind === 'datatype') L.push('@dataclass(frozen=True)');
    L.push(`class ${c.name}${bases.length ? `(${bases.join(', ')})` : ''}:`);
    const B = [];
    if (c.doc) B.push(`    """${c.doc.replace(/\n/g, '\n    ')}"""`, '');
    if (c.kind === 'enumeration') c.literals.forEach(l => B.push(`    ${l.name} = auto()`));
    else if (c.kind === 'datatype') c.attributes.forEach(a => B.push(`    ${snake(a.name)}: ${pyType(a.type, UML.isMany(a.mult))}${a.def ? ' = ' + pyDef(a.def) : ''}`));
    else {
      c.attributes.filter(a => a.isStatic).forEach(a => B.push(`    ${pyName(a.name, a.vis)}: ${pyType(a.type)} = ${pyDef(a.def)}`));
      const inst = c.attributes.filter(a => !a.isStatic);
      if (inst.length || assoc.length || supers.length) {
        if (B.length) B.push('');
        B.push('    def __init__(self) -> None:');
        if (supers.length) B.push('        super().__init__()');
        inst.forEach(a => B.push(`        self.${pyName(a.name, a.vis)}: ${pyType(a.type, UML.isMany(a.mult))}${UML.isOptional(a.mult) ? ' | None' : ''} = ${UML.isMany(a.mult) && !a.def ? '[]' : pyDef(a.def)}`));
        assoc.forEach(f => B.push(`        self.${pyName(f.name, f.vis)}: ${f.qualifier ? `dict[${pyType(f.qualifier.type)}, ${f.type}]` : f.many ? `list[${f.type}]` : `${f.type} | None`} = ${f.qualifier ? '{}' : f.many ? '[]' : 'None'}`));
      }
    }
    c.operations.forEach(o => {
      if (B.length) B.push('');
      const params = o.params.map((x, i) => `${snake(x.name || 'arg' + i)}: ${pyType(x.type, UML.isMany(x.mult))}${x.def ? ' = ' + pyDef(x.def) : ''}`);
      const ret = o.ret ? pyType(o.ret, UML.isMany(o.retMult)) + (UML.isOptional(o.retMult) ? ' | None' : '') : 'None';
      if (o.isStatic) B.push('    @staticmethod', `    def ${pyName(o.name, o.vis)}(${params.join(', ')}) -> ${ret}:`);
      else {
        if (o.isAbstract || c.kind === 'interface') B.push('    @abstractmethod');
        B.push(`    def ${pyName(o.name, o.vis)}(${['self', ...params].join(', ')}) -> ${ret}:`);
      }
      B.push('        raise NotImplementedError');
    });
    if (!B.length) B.push('    pass');
    L.push(...B, '');
    const pkg = UML.qualifiedPackage(p, c.package);
    return { file: (pkg ? pkg.replace(/\./g, '/') + '/' : '') + snake(c.name) + '.py', code: L.join('\n') };
  }

  UML.LANGS = { java: 'Java', ts: 'TypeScript', python: 'Python' };
  UML.generate = function (p, lang, ids) {
    const fn = { java: genJavaOne, ts: genTSOne, python: genPyOne }[lang];
    return selected(p, ids).sort((a, b) => a.name.localeCompare(b.name)).map(c => fn(p, c));
  };

  /* ================= XMI 2.5.1 ================= */
  const xa = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const VISX = { '+': 'public', '-': 'private', '#': 'protected', '~': 'package' };
  UML.exportXMI = function (p) {
    const out = [];
    const prim = new Map();
    const typeRef = t => {
      const base = String(t || '').replace(/<.*$/, '').replace(/\[\]$/, '').trim();
      if (!base) return '';
      const e = UML.classifierByName(p, base);
      if (e) return e.id;
      if (!prim.has(base)) prim.set(base, 'prim_' + base.replace(/\W/g, '_'));
      return prim.get(base);
    };
    const multX = (m, ind) => {
      const b = UML.multBounds(m);
      if (!b) return '';
      return `${ind}<lowerValue xmi:type="uml:LiteralInteger" xmi:id="${uid()}" value="${b.lower}"/>\n${ind}<upperValue xmi:type="uml:LiteralUnlimitedNatural" xmi:id="${uid()}" value="${b.upper === Infinity ? '*' : b.upper}"/>\n`;
    };
    const elementXMI = (e, ind) => {
      const vis = '';
      if (e.kind === 'note') return `${ind}<ownedComment xmi:type="uml:Comment" xmi:id="${e.id}"${Object.values(p.relations).filter(r => r.kind === 'anchor' && (r.source === e.id || r.target === e.id)).length ? ` annotatedElement="${Object.values(p.relations).filter(r => r.kind === 'anchor' && (r.source === e.id || r.target === e.id)).map(r => (r.source === e.id ? r.target : r.source)).join(' ')}"` : ''}>\n${ind}  <body>${xa(e.text)}</body>\n${ind}</ownedComment>\n`;
      if (e.kind === 'nary') return '';
      if (e.kind === 'object') {
        let s = `${ind}<packagedElement xmi:type="uml:InstanceSpecification" xmi:id="${e.id}" name="${xa(e.name)}"${e.classifier ? ` classifier="${e.classifier}"` : ''}>\n`;
        const c = e.classifier && p.elements[e.classifier];
        for (const sl of e.slots) {
          const f = c && [c, ...UML.ancestors(p, c.id)].flatMap(x => x.attributes || []).find(a => a.name === sl.feature);
          s += `${ind}  <slot xmi:id="${sl.id}"${f ? ` definingFeature="${f.id}"` : ''}>\n${ind}    <value xmi:type="uml:LiteralString" xmi:id="${uid()}" value="${xa(sl.value)}"/>\n${ind}  </slot>\n`;
        }
        return s + `${ind}</packagedElement>\n`;
      }
      if (e.kind === 'package') {
        let s = `${ind}<packagedElement xmi:type="uml:Package" xmi:id="${e.id}" name="${xa(e.name)}">\n`;
        Object.values(p.elements).filter(c => c.package === e.id).forEach(c => (s += elementXMI(c, ind + '  ')));
        return s + `${ind}</packagedElement>\n`;
      }
      const type = { class: 'uml:Class', interface: 'uml:Interface', enumeration: 'uml:Enumeration', datatype: 'uml:DataType', primitive: 'uml:PrimitiveType' }[e.kind];
      let s = `${ind}<packagedElement xmi:type="${type}" xmi:id="${e.id}" name="${xa(e.name)}"${e.isAbstract ? ' isAbstract="true"' : ''}${e.isLeaf ? ' isLeaf="true"' : ''}${vis}>\n`;
      if (e.doc) s += `${ind}  <ownedComment xmi:type="uml:Comment" xmi:id="${uid()}"><body>${xa(e.doc)}</body></ownedComment>\n`;
      if (e.templateParams) {
        s += `${ind}  <ownedTemplateSignature xmi:type="uml:RedefinableTemplateSignature" xmi:id="${e.id}_sig">\n`;
        UML.splitTop(e.templateParams, ',').forEach(t => {
          const pid = `${e.id}_tp_${t.replace(/\W/g, '')}`;
          s += `${ind}    <ownedParameter xmi:type="uml:ClassifierTemplateParameter" xmi:id="${pid}"><ownedParameteredElement xmi:type="uml:Class" xmi:id="${pid}_c" name="${xa(t)}"/></ownedParameter>\n`;
        });
        s += `${ind}  </ownedTemplateSignature>\n`;
      }
      for (const r of Object.values(p.relations)) {
        if (r.source !== e.id) continue;
        if (r.kind === 'generalization') s += `${ind}  <generalization xmi:type="uml:Generalization" xmi:id="${r.id}" general="${r.target}"/>\n`;
        if (r.kind === 'realization' && e.kind !== 'interface') s += `${ind}  <interfaceRealization xmi:type="uml:InterfaceRealization" xmi:id="${r.id}" client="${e.id}" supplier="${r.target}" contract="${r.target}"/>\n`;
      }
      (e.literals || []).forEach(l => (s += `${ind}  <ownedLiteral xmi:type="uml:EnumerationLiteral" xmi:id="${l.id}" name="${xa(l.name)}"/>\n`));
      for (const a of e.attributes || []) {
        const t = typeRef(a.type);
        s += `${ind}  <ownedAttribute xmi:type="uml:Property" xmi:id="${a.id}" name="${xa(a.name)}"${a.vis ? ` visibility="${VISX[a.vis]}"` : ''}${a.isStatic ? ' isStatic="true"' : ''}${a.readOnly ? ' isReadOnly="true"' : ''}${a.derived ? ' isDerived="true"' : ''}${t ? ` type="${t}"` : ''}>\n`;
        s += multX(a.mult, ind + '    ');
        if (a.def) s += `${ind}    <defaultValue xmi:type="uml:OpaqueExpression" xmi:id="${uid()}"><body>${xa(a.def)}</body></defaultValue>\n`;
        s += `${ind}  </ownedAttribute>\n`;

  /* ---------- nós ---------- */
  function comps(L, x, y, w, exp) {

  function nodeSVG(v, e, p, o) {

  /* ---------- geometria das linhas ---------- */
  const center = v => ({ x: v.x + v._w / 2, y: v.y + v._h / 2 });

  const shapeOf = (v, e) => (v._L && v._L.lolli ? 'circle' : e.kind === 'nary' ? 'diamond' : 'rect');

    const dx = to.x - from.x, dy = to.y - from.y;

  /* ---------- adornos ---------- */
  const P2 = (q, u, a, n, b) => `${R(q.x - u.x * a + n.x * b)} ${R(q.y - u.y * a + n.y * b)}`;
